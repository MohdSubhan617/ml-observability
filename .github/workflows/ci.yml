
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality, type, and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src scripts

      - name: Audit dependencies
        run: python -m pip_audit --local --skip-editable --progress-spinner off --timeout 60

      - name: Verify application import
        run: python -c "from ml_observability.app import app; assert app.title == 'ML Observability'"

      - name: Smoke test drift evaluation
        run: python scripts/evaluate_drift_scenarios.py --seed 42 --trials 1 --sample-size 20 --feature-count 2

      - name: Smoke test drift method comparison
        run: python scripts/evaluate_drift_methods.py --seeds 42 --trials 1 --sample-sizes 20 --location-shifts 0.8 --variance-scales 1.5 --feature-count 2

      - name: Run tests
        run: python -m pytest -q
